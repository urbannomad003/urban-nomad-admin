@if (product(); as target) {
  <section class="max-h-[90vh] overflow-y-auto border border-stone-200 bg-white p-5 sm:p-6">
    <div class="flex items-start justify-between gap-4 border-b border-stone-200 pb-3.5">
      <div>
        <h2 class="text-base font-semibold text-stone-900">Delete Product</h2>
        <p class="mt-0.5 text-xs text-stone-500">
          This permanently removes the product from Firestore.
        </p>
      </div>
      <button
        type="button"
        (click)="cancelled.emit()"
        aria-label="Close delete confirmation"
        class="p-1 text-stone-500 transition-colors hover:text-stone-900"
      >
        <lucide-icon [img]="icons.X" class="h-4 w-4"></lucide-icon>
      </button>
    </div>

    @if (errorMessage()) {
      <div class="mt-4 border border-red-200 bg-red-50 px-3.5 py-2.5 text-xs font-medium text-red-700">
        {{ errorMessage() }}
      </div>
    }

    <div class="mt-4 flex items-center gap-3.5 border border-stone-200 bg-stone-50 p-3">
      <img
        [src]="target.imageUrl"
        [alt]="target.title"
        class="h-14 w-14 shrink-0 border border-stone-200 object-cover"
      />
      <div class="min-w-0 flex-1">
        <p class="truncate text-sm font-semibold text-stone-900">{{ target.title }}</p>
        <p class="text-xs text-stone-500">
          Color: {{ target.color }} · Stock: {{ target.stockCount }}
        </p>
      </div>
    </div>

    <div class="mt-5 flex items-center justify-end gap-2.5">
      <button
        type="button"
        (click)="cancelled.emit()"
        class="border border-stone-200 bg-white px-4 py-2 text-xs font-medium text-stone-700 transition-colors hover:bg-stone-100"
      >
        Cancel
      </button>
      <button
        type="button"
        (click)="confirmDelete()"
        [disabled]="isDeleting()"
        class="inline-flex items-center gap-2 border border-red-600 bg-red-600 px-4 py-2 text-xs font-semibold text-white transition-colors hover:bg-red-700 disabled:cursor-not-allowed disabled:opacity-50"
      >
        <lucide-icon [img]="icons.Trash2" class="h-4 w-4"></lucide-icon>
        <span>{{ isDeleting() ? 'Deleting...' : 'Confirm Delete' }}</span>
      </button>
    </div>
  </section>
}
